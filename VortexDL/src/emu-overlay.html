<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>模拟器功能条</title>
<link rel="stylesheet" href="emu-overlay.css">
</head>
<body>
<div id="bar">
  <span class="emu-title" id="ov-title">模拟器</span>
  <span class="emu-pad" id="ov-pad" title="输入设备"></span>
  <div class="emu-actions">
    <button id="ov-max" title="最大化模拟器窗口">⛶</button>
    <button id="ov-full" title="全屏">🖵</button>
    <button id="ov-settings" title="设置">⚙</button>
    <button id="ov-close" class="danger" title="关闭游戏">✕</button>
  </div>
</div>
<div id="panel" hidden>
  <div class="panel-row"><label>帧率上限</label><input type="range" id="set-fps" min="30" max="240" step="10"><span id="set-fps-v"></span></div>
  <div class="panel-row"><label>分辨率缩放</label><input type="range" id="set-scale" min="0.5" max="2" step="0.25"><span id="set-scale-v"></span></div>
  <div class="panel-row"><label>手柄震动</label><input type="checkbox" id="set-rumble"></div>
  <div class="panel-row"><label>显示按键提示</label><input type="checkbox" id="set-hint"></div>
  <div class="panel-row"><label>自动隐藏功能条</label><input type="checkbox" id="set-hide"></div>
  <div class="panel-row"><label>输入设备</label><span id="set-source">-</span></div>
  <div class="panel-row">
    <button id="set-binds">重新绑定键位</button>
    <button id="set-reset">恢复默认键位</button>
  </div>
  <div id="binds-list" class="binds" hidden></div>
</div>
<script src="emu-overlay.js"></script>
</body>
</html>
