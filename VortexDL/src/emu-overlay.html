<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>漩涡模拟器 · 功能条</title>
<link rel="stylesheet" href="emu-overlay.css">
</head>
<body>
<!-- 一条细长的悬浮控制条：默认只有一个把手 + 实时读数，
     鼠标移上去才展开按钮，不遮挡游戏画面 -->
<div id="bar">
  <span class="ov-drag" id="ov-drag" title="拖动">⋮⋮</span>
  <span class="ov-live" id="ov-live">— FPS</span>
  <span class="ov-title" id="ov-title">模拟器</span>
  <div class="emu-actions">
    <button id="ov-max" title="最大化">⛶</button>
    <button id="ov-full" title="全屏">🖵</button>
    <button id="ov-record" title="开始/停止帧率记录">⏺</button>
    <button id="ov-settings" title="设置">⚙</button>
    <button id="ov-close" class="danger" title="关闭游戏">✕</button>
  </div>
</div>

<div id="panel" hidden>
  <div class="panel-tabs">
    <button class="ptab active" data-tab="perf">性能</button>
    <button class="ptab" data-tab="emu">模拟器</button>
    <button class="ptab" data-tab="input">输入</button>
    <button class="ptab" data-tab="fps">帧率记录</button>
  </div>

  <!-- 性能 -->
  <div class="ppanel active" data-panel="perf">
    <div class="metric-grid">
      <div class="metric"><div class="m-label">帧率</div><div class="m-val" id="m-fps">—</div></div>
      <div class="metric"><div class="m-label">帧时间</div><div class="m-val" id="m-ft">—</div></div>
      <div class="metric"><div class="m-label">CPU</div><div class="m-val" id="m-cpu">—</div></div>
      <div class="metric"><div class="m-label">GPU</div><div class="m-val" id="m-gpu">—</div></div>
      <div class="metric"><div class="m-label">内存</div><div class="m-val" id="m-ram">—</div></div>
      <div class="metric"><div class="m-label">游戏进程</div><div class="m-val" id="m-proc">—</div></div>
    </div>
    <div class="cores-wrap">
      <div class="cores-head">CPU 各核心</div>
      <div class="cores" id="m-cores"></div>
    </div>
    <div class="panel-note" id="fps-note"></div>
  </div>

  <!-- 模拟器 -->
  <div class="ppanel" data-panel="emu">
    <div class="panel-row"><label>主机语言</label><span class="ro">简体中文（游戏内文字）</span></div>
    <div class="panel-row"><label>画质预设</label>
      <button id="btn-preset">重新应用中文/画质预设</button></div>
    <div class="panel-row"><label>模拟器密钥</label>
      <span id="emu-keys-state" class="ro">检查中…</span>
      <button id="btn-keys">导入密钥</button></div>
    <div class="panel-row"><label>游戏目录</label>
      <button id="btn-folder">打开</button></div>
    <div class="panel-row"><label>模拟器目录</label>
      <button id="btn-emu-folder">打开</button></div>
    <div class="panel-row"><label>使用说明</label>
      <button id="btn-guide">打开</button></div>
    <div class="panel-row"><label>重装模拟器</label>
      <button id="btn-install">从安装包重新释出</button></div>
    <div class="panel-row"><label>刷新游戏列表</label>
      <button id="btn-refresh">刷新</button></div>
  </div>

  <!-- 输入 -->
  <div class="ppanel" data-panel="input">
    <div class="panel-row"><label>输入设备</label><span id="set-source" class="ro">-</span></div>
    <div class="panel-row"><label>手柄震动</label><input type="checkbox" id="set-rumble"></div>
    <div class="panel-row"><label>显示按键提示</label><input type="checkbox" id="set-hint"></div>
    <div class="panel-row"><label>自动隐藏功能条</label><input type="checkbox" id="set-hide"></div>
    <div class="panel-row"><label>背景透明度</label>
      <input type="range" id="set-alpha" min="0.25" max="1" step="0.05"><span id="set-alpha-v"></span></div>
    <div class="panel-row">
      <button id="set-binds">重新绑定键位</button>
      <button id="set-reset">恢复默认键位</button>
    </div>
    <div id="binds-list" class="binds" hidden></div>
  </div>

  <!-- 帧率记录 -->
  <div class="ppanel" data-panel="fps">
    <div class="panel-row"><label>记录模式</label>
      <select id="fps-mode">
        <option value="off">关闭</option>
        <option value="inline">游戏内（只在游戏前台时记录）</option>
        <option value="global">全局（一直记录）</option>
      </select></div>
    <div class="panel-row"><label>游戏内采样间隔</label>
      <input type="range" id="fps-inline" min="200" max="2000" step="100"><span id="fps-inline-v"></span></div>
    <div class="panel-row"><label>全局采样间隔</label>
      <input type="range" id="fps-global" min="500" max="5000" step="100"><span id="fps-global-v"></span></div>
    <div class="panel-row"><label>记录每核占用</label><input type="checkbox" id="fps-percore"></div>
    <div class="panel-row"><label>当前状态</label><span id="fps-state" class="ro">未在记录</span></div>
    <div class="panel-row">
      <button id="fps-toggle">开始记录</button>
      <button id="fps-open">打开记录列表</button>
    </div>
  </div>
</div>
<script src="emu-overlay.js"></script>
</body>
</html>
