[package]
name = "hello_plugin"
version = "0.1.0"
edition = "2021"
description = "SwiftFetch 示例 EXE 插件 - 订阅块完成事件"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "codec"] }
anyhow = "1"
parking_lot = "0.12"
